<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COSMOS - Where Light Takes Form</title>
  </head>
  <body>
    <!-- Background Header Brand Logo (Positioned BEHIND WebGL Canvas & 3D Model Wire) -->
    <div class="nav-brand-background" style="opacity: 0; transition: opacity 0.3s ease;">
      <span class="brand-text">COSMOS</span>
    </div>

    <!-- WebGL Canvas for 3D Lamp, Suspension Cord, and Shader Typography -->
    <canvas id="webgl"></canvas>

    <!-- UI Component Mount Container (Interactive Navigation & CTA Buttons) -->
    <div id="app"></div>

    <!-- Mobile / Smaller Screen Notice Overlay (WIP) -->
    <div class="mobile-notice-overlay" style="display: none;">
      <div class="mobile-notice-content">
        <span class="mobile-brand">COSMOS</span>
        <p class="mobile-notice-subtitle">Mobile version is work in progress (WIP). Please view on a desktop screen for the full interactive experience.</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
